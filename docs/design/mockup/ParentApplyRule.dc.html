<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Bố mẹ: Thưởng hoặc phạt</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&amp;family=Nunito:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Nunito',system-ui,sans-serif}
a{color:inherit}a:hover{color:inherit}
button,input{font-family:inherit}
button{cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{t.bg}}; color: {{t.ink}}; display: flex; flex-direction: column; gap: 14px; padding: 16px 20px 20px 20px; overflow: hidden">

  <div style="display: flex; align-items: center; gap: 8px">
    <a href="ParentDashboard.dc.html" aria-label="Quay lại" style="width: 44px; height: 44px; border-radius: 14px; display: flex; align-items: center; justify-content: center; text-decoration: none; background: {{t.card}}">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
    <h1 style="margin: 0; font-family: 'Baloo 2', sans-serif; font-size: 24px; font-weight: 800">Thưởng / Phạt</h1>
  </div>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
    <sc-for list="{{kids}}" as="k" hint-placeholder-count="3">
      <button onClick="{{k.pick}}" aria-pressed="{{k.pressed}}" style="min-height: 56px; border-radius: 16px; border: 3px solid {{k.border}}; background: {{t.card}}; color: {{t.ink}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0">
        <span style="font-size: 16px; font-weight: 800">{{k.name}}</span>
        <span style="font-size: 12px; font-weight: 700; color: {{t.muted}}">{{k.balance}} Sao</span>
      </button>
    </sc-for>
  </div>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 16px; background: {{t.soft}}">
    <button onClick="{{setReward}}" aria-pressed="{{rewardPressed}}" style="min-height: 44px; border: none; border-radius: 12px; background: {{rewardBg}}; color: {{rewardFg}}; font-size: 16px; font-weight: 800">+ Thưởng</button>
    <button onClick="{{setPenalty}}" aria-pressed="{{penaltyPressed}}" style="min-height: 44px; border: none; border-radius: 12px; background: {{penaltyBg}}; color: {{penaltyFg}}; font-size: 16px; font-weight: 800">− Phạt</button>
  </div>

  <span style="font-size: 13px; font-weight: 800; color: {{t.muted}}; letter-spacing: .04em">CHỌN RULE</span>
  <div style="display: flex; flex-direction: column; gap: 8px">
    <sc-for list="{{rules}}" as="r" hint-placeholder-count="4">
      <button onClick="{{r.pick}}" aria-pressed="{{r.pressed}}" style="min-height: 52px; border-radius: 16px; border: 3px solid {{r.border}}; background: {{t.card}}; color: {{t.ink}}; display: flex; align-items: center; gap: 10px; padding: 0 14px; text-align: left">
        <span style="width: 20px; height: 20px; border-radius: 50%; border: 3px solid {{t.primary}}; box-sizing: border-box; background: {{r.dot}}"></span>
        <span style="flex: 1; font-size: 16px; font-weight: 800">{{r.name}}</span>
        <span style="font-family: 'Baloo 2', sans-serif; font-size: 18px; font-weight: 800; color: {{r.color}}">{{r.label}}</span>
      </button>
    </sc-for>
    <button onClick="{{pickAdhoc}}" aria-pressed="{{adhocPressed}}" style="min-height: 52px; border-radius: 16px; border: 3px dashed {{adhocBorder}}; background: transparent; color: {{t.ink}}; display: flex; align-items: center; gap: 10px; padding: 0 14px; text-align: left; font-size: 16px; font-weight: 800">
      <span style="width: 20px; height: 20px; border-radius: 50%; border: 3px solid {{t.primary}}; box-sizing: border-box; background: {{adhocDot}}"></span>Đột xuất (ngoài rule)</button>
  </div>

  <sc-if value="{{isAdhoc}}" hint-placeholder-val="{{ false }}">
    <div style="display: flex; gap: 8px">
      <label style="display: flex; flex-direction: column; gap: 4px; width: 90px; font-size: 13px; font-weight: 800; color: {{t.muted}}">Số điểm
        <input type="number" value="20" style="min-height: 44px; border-radius: 12px; border: 2px solid rgba(0,0,0,.15); padding: 0 10px; font-size: 16px; font-weight: 800; color: {{t.ink}}; background: {{t.card}}; box-sizing: border-box; width: 100%"></label>
      <label style="display: flex; flex-direction: column; gap: 4px; flex: 1; font-size: 13px; font-weight: 800; color: {{t.muted}}">Lý do (bắt buộc)
        <input type="text" placeholder="VD: Giúp bà dọn nhà" style="min-height: 44px; border-radius: 12px; border: 2px solid rgba(0,0,0,.15); padding: 0 10px; font-size: 16px; color: {{t.ink}}; background: {{t.card}}; box-sizing: border-box; width: 100%"></label>
    </div>
  </sc-if>
  <sc-if value="{{notAdhoc}}" hint-placeholder-val="{{ true }}">
    <label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 800; color: {{t.muted}}">Ghi chú (không bắt buộc)
      <input type="text" placeholder="VD: lúc ăn tối" style="min-height: 44px; border-radius: 12px; border: 2px solid rgba(0,0,0,.15); padding: 0 12px; font-size: 16px; color: {{t.ink}}; background: {{t.card}}; box-sizing: border-box"></label>
  </sc-if>

  <div style="flex: 1"></div>

  <sc-if value="{{capped}}" hint-placeholder-val="{{ false }}">
    <div style="display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 14px; background: #FFF1C2; color: #5C3A00; font-size: 14px; font-weight: 700">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true" style="flex: none; margin-top: 1px"><circle cx="12" cy="12" r="9"/><path d="M12 8v5"/><path d="M12 16.5h.01"/></svg>
      <span>{{kidName}} chỉ còn {{balance}} Sao, nên chỉ trừ được {{balance}}. Lịch sử vẫn ghi mức phạt gốc {{amount}}.</span>
    </div>
  </sc-if>

  <sc-if value="{{hasToast}}" hint-placeholder-val="{{ false }}">
    <div role="status" style="display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-radius: 14px; background: {{t.ink}}; color: #FFFFFF; font-size: 15px; font-weight: 800">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>{{toastText}}</div>
  </sc-if>
  <button onClick="{{submit}}" style="min-height: 56px; border: none; border-radius: 18px; background: {{ctaBg}}; color: #FFFFFF; font-size: 18px; font-weight: 800; box-shadow: 0 4px 0 rgba(0,0,0,.18)">{{cta}}</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["sunny","ocean","candy","robot","magic"],"default":"sunny"},"$preview":{"width":390,"height":844}}'>
var THEMES = {
  sunny: { bg: '#FFF6DF', card: '#FFFFFF', soft: '#FFE7A8', ring: '#FFC94D', primary: '#C2410C', onPrimary: '#FFFFFF', accent: '#F59E0B', ink: '#2B2118', muted: '#6B5644' },
  ocean: { bg: '#E6F5FA', card: '#FFFFFF', soft: '#C7ECF5', ring: '#7DD3E8', primary: '#0E7490', onPrimary: '#FFFFFF', accent: '#14B8A6', ink: '#0F2A33', muted: '#486570' },
  candy: { bg: '#FDEEF6', card: '#FFFFFF', soft: '#F8D2E8', ring: '#F0A6D6', primary: '#A21CAF', onPrimary: '#FFFFFF', accent: '#EC4899', ink: '#2E1530', muted: '#6E4D6E' },
  robot: { bg: '#EEF2F7', card: '#FFFFFF', soft: '#D6E0EE', ring: '#F5C518', primary: '#1D4ED8', onPrimary: '#FFFFFF', accent: '#E11D2E', ink: '#0F172A', muted: '#475569' },
  magic: { bg: '#FFF3F8', card: '#FFFFFF', soft: '#FFD9E8', ring: '#F7C948', primary: '#BE185D', onPrimary: '#FFFFFF', accent: '#E9A400', ink: '#3A0F24', muted: '#7A3B5A' }
};
var SFX_CTX = null;
var SFX = {
  reward: { type: 'triangle', gain: 0.18, notes: [[523.25, 0, 0.16], [659.25, 0.09, 0.16], [783.99, 0.18, 0.16], [1046.5, 0.27, 0.4]] },
  penalty: { type: 'sine', gain: 0.16, notes: [[392, 0, 0.28], [293.66, 0.22, 0.45]] }
};
function playSfx(name) {
  try {
    var C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    if (!SFX_CTX) SFX_CTX = new C();
    if (SFX_CTX.state === 'suspended') SFX_CTX.resume();
    var s = SFX[name], now = SFX_CTX.currentTime;
    s.notes.forEach(function (n) {
      var o = SFX_CTX.createOscillator(), g = SFX_CTX.createGain();
      o.type = s.type; o.frequency.value = n[0];
      g.gain.setValueAtTime(0.0001, now + n[1]);
      g.gain.exponentialRampToValueAtTime(s.gain, now + n[1] + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, now + n[1] + n[2]);
      o.connect(g); g.connect(SFX_CTX.destination);
      o.start(now + n[1]); o.stop(now + n[1] + n[2] + 0.05);
    });
  } catch (e) {}
}
var RULES = {
  reward: [
    { id: 'r1', name: 'Đánh răng tối', pts: 5 },
    { id: 'r2', name: 'Giúp việc nhà', pts: 10 },
    { id: 'r3', name: 'Tự dọn đồ chơi', pts: 5 },
    { id: 'r4', name: 'Đi ngủ đúng giờ', pts: 8 }
  ],
  penalty: [
    { id: 'p1', name: 'Nói trống không', pts: 5 },
    { id: 'p2', name: 'Nói dối', pts: 10 },
    { id: 'p3', name: 'Đánh nhau với anh chị em', pts: 20 },
    { id: 'p4', name: 'Xem điện thoại quá giờ', pts: 10 }
  ]
};
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { kid: 'Su', kind: 'penalty', rule: 'p2' };
  }
  renderVals() {
    var t = THEMES[this.props.theme ?? 'sunny'] || THEMES.sunny;
    var self = this;
    var s = this.state;
    var GREEN = '#15803D', RED = '#B91C1C';
    var list = [{ name: 'Bin', balance: 120 }, { name: 'Na', balance: 45 }, { name: 'Su', balance: 3 }];
    var kid = list.filter(function (k) { return k.name === s.kid; })[0];
    var kids = list.map(function (k) {
      var on = k.name === s.kid;
      return Object.assign({}, k, { pressed: on ? 'true' : 'false', border: on ? t.primary : 'transparent', pick: function () { self.setState({ kid: k.name }); } });
    });
    var isR = s.kind === 'reward';
    var color = isR ? GREEN : RED;
    var rules = RULES[s.kind].map(function (r) {
      var on = r.id === s.rule;
      return Object.assign({}, r, {
        pressed: on ? 'true' : 'false', border: on ? t.primary : 'transparent', dot: on ? t.primary : 'transparent',
        label: (isR ? '+' : '−') + r.pts, color: color,
        pick: function () { self.setState({ rule: r.id }); }
      });
    });
    var isAdhoc = s.rule === 'adhoc';
    var picked = RULES[s.kind].filter(function (r) { return r.id === s.rule; })[0];
    var pts = isAdhoc ? 20 : (picked ? picked.pts : 0);
    var capped = !isR && pts > kid.balance;
    var applied = capped ? kid.balance : pts;
    var cta = (isR ? 'Thưởng ' + kid.name + ' +' : 'Phạt ' + kid.name + ' −') + applied + ' Sao';
    return {
      t: t, kids: kids, rules: rules,
      rewardPressed: isR ? 'true' : 'false', penaltyPressed: isR ? 'false' : 'true',
      rewardBg: isR ? t.card : 'transparent', rewardFg: isR ? GREEN : t.muted,
      penaltyBg: isR ? 'transparent' : t.card, penaltyFg: isR ? t.muted : RED,
      setReward: function () { self.setState({ kind: 'reward', rule: 'r1' }); },
      setPenalty: function () { self.setState({ kind: 'penalty', rule: 'p1' }); },
      pickAdhoc: function () { self.setState({ rule: 'adhoc' }); },
      isAdhoc: isAdhoc, notAdhoc: !isAdhoc,
      adhocPressed: isAdhoc ? 'true' : 'false', adhocBorder: isAdhoc ? t.primary : 'rgba(0,0,0,.2)', adhocDot: isAdhoc ? t.primary : 'transparent',
      capped: capped, kidName: kid.name, balance: kid.balance, amount: '−' + pts,
      cta: cta, ctaBg: color,
      hasToast: !!s.toast, toastText: s.toast || '',
      submit: function () {
        playSfx(isR ? 'reward' : 'penalty');
        self.setState({ toast: 'Đã ghi: ' + cta });
        clearTimeout(self.toastTimer);
        self.toastTimer = setTimeout(function () { self.setState({ toast: '' }); }, 2500);
      }
    };
  }
}
</script>
</body>
</html>
