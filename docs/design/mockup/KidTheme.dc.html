<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Con chọn theme</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&amp;family=Nunito:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Nunito',system-ui,sans-serif}
a{color:inherit}a:hover{color:inherit}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{t.bg}}; color: {{t.ink}}; display: flex; flex-direction: column; gap: 12px; padding: 16px 20px 20px 20px; overflow: hidden">

  <div style="display: flex; align-items: center; gap: 8px">
    <a href="Main.dc.html" aria-label="Quay lại" style="width: 44px; height: 44px; border-radius: 14px; display: flex; align-items: center; justify-content: center; text-decoration: none; background: {{t.card}}">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
    <h1 style="margin: 0; font-family: 'Baloo 2', sans-serif; font-size: 24px; font-weight: 800">Chọn giao diện của con</h1>
  </div>

  <button onClick="{{pickFamily}}" aria-pressed="{{familyPressed}}" style="min-height: 52px; border-radius: 16px; border: 3px solid {{familyBorder}}; background: {{t.card}}; color: {{t.ink}}; display: flex; align-items: center; gap: 10px; padding: 0 14px; text-align: left">
    <span style="width: 20px; height: 20px; border-radius: 50%; border: 3px solid {{t.primary}}; box-sizing: border-box; background: {{familyDot}}"></span>
    <span style="display: flex; flex-direction: column">
      <span style="font-size: 15px; font-weight: 800">Dùng theme của gia đình</span>
      <span style="font-size: 12px; font-weight: 700; color: {{t.muted}}">Hiện tại: Nắng mai</span>
    </span>
  </button>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
    <sc-for list="{{themes}}" as="th" hint-placeholder-count="5">
      <button onClick="{{th.pick}}" aria-pressed="{{th.pressed}}" style="border-radius: 20px; border: 3px solid {{th.border}}; background: {{t.card}}; color: {{t.ink}}; padding: 8px; display: flex; flex-direction: column; gap: 6px; text-align: left">
        <div style="height: 92px; border-radius: 14px; background: {{th.c.bg}}; padding: 8px; box-sizing: border-box; display: flex; flex-direction: column; gap: 6px; position: relative; overflow: hidden">
          <div style="height: 30px; width: 70%; border-radius: 10px; background: {{th.c.primary}}"></div>
          <div style="height: 8px; width: 80%; border-radius: 99px; background: {{th.c.soft}}; overflow: hidden"><div style="width: 60%; height: 100%; background: {{th.c.accent}}"></div></div>
          <div style="height: 16px; width: 55%; border-radius: 6px; background: {{th.c.card}}"></div>
          <sc-if value="{{th.isRobot}}" hint-placeholder-val="{{ false }}">
            <svg width="46" height="46" viewBox="0 0 64 64" aria-hidden="true" style="position: absolute; right: 4px; bottom: 4px"><path d="M32 16V8" stroke="#1E3A8A" stroke-width="3" stroke-linecap="round"/><circle cx="32" cy="7" r="4" fill="#F5C518" stroke="#1E3A8A" stroke-width="2"/><rect x="6" y="28" width="6" height="12" rx="3" fill="#E11D2E"/><rect x="52" y="28" width="6" height="12" rx="3" fill="#E11D2E"/><rect x="12" y="16" width="40" height="34" rx="12" fill="#FFFFFF" stroke="#1E3A8A" stroke-width="3"/><rect x="18" y="25" width="28" height="15" rx="7" fill="#0F172A"/><circle cx="26" cy="32.5" r="3.5" fill="#5EEAD4"/><circle cx="38" cy="32.5" r="3.5" fill="#5EEAD4"/><path d="M27 45h10" stroke="#1E3A8A" stroke-width="2.5" stroke-linecap="round"/></svg>
          </sc-if>
          <sc-if value="{{th.isMagic}}" hint-placeholder-val="{{ false }}">
            <svg width="46" height="46" viewBox="0 0 64 64" aria-hidden="true" style="position: absolute; right: 4px; bottom: 4px"><path d="M16 56L36 30" stroke="#9D174D" stroke-width="4" stroke-linecap="round"/><path d="M40 14c-3-5-11-4-11 3 0 6 11 12 11 12s11-6 11-12c0-7-8-8-11-3z" fill="#F472B6" stroke="#9D174D" stroke-width="2"/><path d="M58 44a8 8 0 1 1-7-13 6.5 6.5 0 0 0 7 13z" fill="#F7C948"/><path d="M14 14l1.5 3.5L19 19l-3.5 1.5L14 24l-1.5-3.5L9 19l3.5-1.5z" fill="#F7C948"/></svg>
          </sc-if>
        </div>
        <span style="font-size: 15px; font-weight: 800; padding: 0 4px">{{th.name}}</span>
      </button>
    </sc-for>
  </div>

  <div style="flex: 1"></div>
  <a href="Main.dc.html" style="min-height: 56px; display: flex; align-items: center; justify-content: center; border-radius: 18px; background: {{t.primary}}; color: {{t.onPrimary}}; text-decoration: none; font-size: 18px; font-weight: 800; box-shadow: 0 4px 0 rgba(0,0,0,.18)">Dùng giao diện này</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
var THEMES = {
  sunny: { bg: '#FFF6DF', card: '#FFFFFF', soft: '#FFE7A8', ring: '#FFC94D', primary: '#C2410C', onPrimary: '#FFFFFF', accent: '#F59E0B', ink: '#2B2118', muted: '#6B5644' },
  ocean: { bg: '#E6F5FA', card: '#FFFFFF', soft: '#C7ECF5', ring: '#7DD3E8', primary: '#0E7490', onPrimary: '#FFFFFF', accent: '#14B8A6', ink: '#0F2A33', muted: '#486570' },
  candy: { bg: '#FDEEF6', card: '#FFFFFF', soft: '#F8D2E8', ring: '#F0A6D6', primary: '#A21CAF', onPrimary: '#FFFFFF', accent: '#EC4899', ink: '#2E1530', muted: '#6E4D6E' },
  robot: { bg: '#EEF2F7', card: '#FFFFFF', soft: '#D6E0EE', ring: '#F5C518', primary: '#1D4ED8', onPrimary: '#FFFFFF', accent: '#E11D2E', ink: '#0F172A', muted: '#475569' },
  magic: { bg: '#FFF3F8', card: '#FFFFFF', soft: '#FFD9E8', ring: '#F7C948', primary: '#BE185D', onPrimary: '#FFFFFF', accent: '#E9A400', ink: '#3A0F24', muted: '#7A3B5A' }
};
var NAMES = { sunny: 'Nắng mai', ocean: 'Biển xanh', candy: 'Kẹo ngọt', robot: 'Robot chiến binh', magic: 'Phép thuật' };
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { picked: 'robot' };
  }
  renderVals() {
    var self = this;
    var p = this.state.picked;
    var t = THEMES[p === 'family' ? 'sunny' : p];
    var themes = ['robot', 'magic', 'sunny', 'ocean', 'candy'].map(function (id) {
      var on = id === p;
      return {
        name: NAMES[id], c: THEMES[id], isRobot: id === 'robot', isMagic: id === 'magic',
        pressed: on ? 'true' : 'false', border: on ? t.primary : 'transparent',
        pick: function () { self.setState({ picked: id }); }
      };
    });
    var fam = p === 'family';
    return {
      t: t, themes: themes,
      familyPressed: fam ? 'true' : 'false', familyBorder: fam ? t.primary : 'transparent', familyDot: fam ? t.primary : 'transparent',
      pickFamily: function () { self.setState({ picked: 'family' }); }
    };
  }
}
</script>
</body>
</html>
