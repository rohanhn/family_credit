<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Cửa hàng đổi thưởng</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&amp;family=Nunito:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Nunito',system-ui,sans-serif}
a{color:inherit}a:hover{color:inherit}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{t.bg}}; color: {{t.ink}}; display: flex; flex-direction: column; overflow: hidden">

  <div style="display: flex; flex-direction: column; gap: 14px; padding: 20px 20px 0 20px; flex: 1; overflow: hidden">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <h1 style="margin: 0; font-family: 'Baloo 2', sans-serif; font-size: 28px; font-weight: 800">Cửa hàng</h1>
      <span style="display: flex; align-items: center; gap: 6px; padding: 6px 14px 6px 8px; border-radius: 99px; background: {{t.card}}; font-family: 'Baloo 2', sans-serif; font-size: 20px; font-weight: 800; box-shadow: 0 2px 0 rgba(0,0,0,.06)">
        <svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6 6.6.8-4.9 4.6 1.3 6.5L12 17.2 6.1 20.4l1.3-6.5L2.5 9.3l6.6-.8z" fill="#FFC531" stroke="#8A5A00" stroke-width="1" stroke-linejoin="round"/></svg>{{balance}} Sao</span>
    </div>

    <sc-if value="{{hasPending}}" hint-placeholder-val="{{ true }}">
      <div style="background: #FFF1C2; color: #5C3A00; border-radius: 18px; padding: 10px 12px 10px 14px; display: flex; align-items: center; gap: 10px">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        <span style="flex: 1; font-size: 14px; font-weight: 700"><b>{{pendingName}}</b> đang chờ bố mẹ duyệt. Điểm chưa bị trừ.</span>
        <button onClick="{{cancel}}" style="min-height: 44px; padding: 0 12px; border: 2px solid #5C3A00; background: transparent; color: #5C3A00; border-radius: 14px; font-size: 14px; font-weight: 800">Hủy</button>
      </div>
    </sc-if>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
      <sc-for list="{{rewards}}" as="r" hint-placeholder-count="4">
        <div style="background: {{t.card}}; border-radius: 22px; padding: 12px; display: flex; flex-direction: column; gap: 8px; box-shadow: 0 3px 0 rgba(0,0,0,.05); border: 3px solid {{r.goalBorder}}; position: relative">
          <sc-if value="{{r.isGoal}}" hint-placeholder-val="{{ false }}">
            <span style="position: absolute; top: -10px; left: 12px; font-size: 12px; font-weight: 800; padding: 2px 10px; border-radius: 99px; background: {{t.primary}}; color: {{t.onPrimary}}">Mục tiêu</span>
          </sc-if>
          <div style="height: 86px; border-radius: 16px; background: {{t.soft}}; display: flex; align-items: center; justify-content: center">
            <svg width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="{{t.primary}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{r.icon}}"/></svg>
          </div>
          <span style="font-size: 15px; font-weight: 800; line-height: 1.25; min-height: 38px">{{r.name}}</span>
          <span style="font-family: 'Baloo 2', sans-serif; font-size: 20px; font-weight: 800; color: {{t.primary}}">{{r.price}} Sao</span>
          <sc-if value="{{r.canBuy}}" hint-placeholder-val="{{ true }}">
            <button onClick="{{r.buy}}" style="min-height: 44px; border: none; border-radius: 14px; background: {{t.primary}}; color: {{t.onPrimary}}; font-size: 15px; font-weight: 800; box-shadow: 0 3px 0 rgba(0,0,0,.18)">Đổi</button>
          </sc-if>
          <sc-if value="{{r.short}}" hint-placeholder-val="{{ false }}">
            <div style="display: flex; flex-direction: column; gap: 4px">
              <div style="height: 10px; border-radius: 99px; background: {{t.soft}}; overflow: hidden"><div style="width: {{r.pct}}; height: 100%; background: {{t.accent}}; border-radius: 99px"></div></div>
              <span style="font-size: 13px; font-weight: 800; color: {{t.muted}}; min-height: 30px; display: flex; align-items: center">Còn thiếu {{r.missing}}</span>
            </div>
          </sc-if>
          <sc-if value="{{r.waiting}}" hint-placeholder-val="{{ false }}">
            <span style="min-height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 14px; background: #FFF1C2; color: #5C3A00; font-size: 14px; font-weight: 800">Chờ duyệt</span>
          </sc-if>
        </div>
      </sc-for>
    </div>
  </div>

  <nav style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: {{t.card}}; padding: 8px 8px 14px 8px; border-top: 1px solid rgba(0,0,0,.06)">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; text-decoration: none; color: {{t.muted}}; font-size: 12px; font-weight: 700">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>Trang chính</a>
    <a href="KidShop.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; text-decoration: none; color: {{t.primary}}; font-size: 12px; font-weight: 800">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="9" width="18" height="12" rx="2"/><path d="M12 9v12"/><path d="M3 13h18"/><path d="M12 9C10 4 6 5 7.5 8c.6 1 4.5 1 4.5 1s3.9 0 4.5-1C18 5 14 4 12 9z"/></svg>Cửa hàng</a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; text-decoration: none; color: {{t.muted}}; font-size: 12px; font-weight: 700">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Lịch sử</a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; text-decoration: none; color: {{t.muted}}; font-size: 12px; font-weight: 700">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h12"/><path d="M8 12h12"/><path d="M8 18h12"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg>Rule</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["sunny","ocean","candy","robot","magic"],"default":"sunny"},"$preview":{"width":390,"height":844}}'>
var THEMES = {
  sunny: { bg: '#FFF6DF', card: '#FFFFFF', soft: '#FFE7A8', ring: '#FFC94D', primary: '#C2410C', onPrimary: '#FFFFFF', accent: '#F59E0B', ink: '#2B2118', muted: '#6B5644' },
  ocean: { bg: '#E6F5FA', card: '#FFFFFF', soft: '#C7ECF5', ring: '#7DD3E8', primary: '#0E7490', onPrimary: '#FFFFFF', accent: '#14B8A6', ink: '#0F2A33', muted: '#486570' },
  candy: { bg: '#FDEEF6', card: '#FFFFFF', soft: '#F8D2E8', ring: '#F0A6D6', primary: '#A21CAF', onPrimary: '#FFFFFF', accent: '#EC4899', ink: '#2E1530', muted: '#6E4D6E' },
  robot: { bg: '#EEF2F7', card: '#FFFFFF', soft: '#D6E0EE', ring: '#F5C518', primary: '#1D4ED8', onPrimary: '#FFFFFF', accent: '#E11D2E', ink: '#0F172A', muted: '#475569' },
  magic: { bg: '#FFF3F8', card: '#FFFFFF', soft: '#FFD9E8', ring: '#F7C948', primary: '#BE185D', onPrimary: '#FFFFFF', accent: '#E9A400', ink: '#3A0F24', muted: '#7A3B5A' }
};
var ICONS = {
  game: 'M6 9h12a3 3 0 0 1 3 3v3a3 3 0 0 1-5 2l-1.5-1.5h-5L8 17a3 3 0 0 1-5-2v-3a3 3 0 0 1 3-3zM8 11v3M6.5 12.5h3M16 12h.01M18 14h.01',
  icecream: 'M8 10a4 4 0 1 1 8 0M7 10h10l-5 11zM9.5 14h5',
  park: 'M12 3l5 7h-3l4 6H6l4-6H7zM12 16v5M5 21h14',
  blocks: 'M4 10h16v10H4zM7 10V7h4v3M13 10V7h4v3M4 15h16'
};
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { pending: 'ice' };
  }
  renderVals() {
    var t = THEMES[this.props.theme ?? 'sunny'] || THEMES.sunny;
    var self = this;
    var balance = 120;
    var list = [
      { id: 'game', name: '30 phút chơi game', price: 50, icon: ICONS.game },
      { id: 'ice', name: 'Kem ốc quế', price: 80, icon: ICONS.icecream },
      { id: 'park', name: 'Đi công viên', price: 200, icon: ICONS.park, goal: true },
      { id: 'lego', name: 'Bộ Lego nhỏ', price: 350, icon: ICONS.blocks }
    ];
    var pend = this.state.pending;
    var rewards = list.map(function (r) {
      var waiting = pend === r.id;
      var enough = balance >= r.price;
      return Object.assign({}, r, {
        isGoal: !!r.goal,
        goalBorder: r.goal ? t.primary : 'transparent',
        waiting: waiting,
        canBuy: enough && !waiting,
        short: !enough,
        missing: r.price - balance,
        pct: Math.min(100, Math.round(balance / r.price * 100)) + '%',
        buy: function () { self.setState({ pending: r.id }); }
      });
    });
    var p = list.filter(function (r) { return r.id === pend; })[0];
    return {
      t: t, balance: balance, rewards: rewards,
      hasPending: !!p, pendingName: p ? p.name : '',
      cancel: function () { self.setState({ pending: null }); }
    };
  }
}
</script>
</body>
</html>
