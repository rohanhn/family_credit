<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Web: Cửa hàng đổi thưởng</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&amp;family=Nunito:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Nunito',system-ui,sans-serif}
a{color:inherit}a:hover{color:inherit}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="min-height: 900px; box-sizing: border-box; background: {{t.bg}}; color: {{t.ink}}">
  <div style="max-width: 1240px; margin: 0 auto; padding: 24px; display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start">

    <aside style="flex: 1 1 220px; background: {{t.card}}; border-radius: 28px; padding: 20px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 3px 0 rgba(0,0,0,.05)">
      <div style="display: flex; align-items: center; gap: 12px">
        <div style="width: 64px; height: 64px; border-radius: 50%; background: {{t.soft}}; border: 3px solid {{t.ring}}; display: flex; align-items: center; justify-content: center">
          <svg width="54" height="54" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="34" r="22" fill="#FFE3C8"/><path d="M9 34C8 16 20 8 32 8s24 8 23 26c-3-8-9-12-15-12-3 4-9 6-14 6-6 0-11 2-17 6z" fill="#3B2A20"/><ellipse cx="24" cy="38" rx="3.2" ry="4" fill="#2B2118"/><ellipse cx="40" cy="38" rx="3.2" ry="4" fill="#2B2118"/><circle cx="25.2" cy="36.5" r="1.1" fill="#fff"/><circle cx="41.2" cy="36.5" r="1.1" fill="#fff"/><ellipse cx="18" cy="45" rx="3.5" ry="2.2" fill="#FF8FA3" opacity=".55"/><ellipse cx="46" cy="45" rx="3.5" ry="2.2" fill="#FF8FA3" opacity=".55"/><path d="M28.5 46q3.5 3 7 0" fill="none" stroke="#2B2118" stroke-width="1.8" stroke-linecap="round"/></svg>
        </div>
        <div style="display: flex; flex-direction: column">
          <span style="font-family: 'Baloo 2', sans-serif; font-size: 24px; font-weight: 800; line-height: 1.1">Bin</span>
          <span style="font-size: 13px; font-weight: 700; color: {{t.muted}}">Nhà Bin &amp; Na</span>
        </div>
      </div>
      <nav style="display: flex; flex-direction: column; gap: 4px">
        <a href="WebKidHome.dc.html" style="display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 14px; text-decoration: none; font-weight: 700; font-size: 16px; color: {{t.muted}}">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>Trang chính</a>
        <a href="WebKidShop.dc.html" style="display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 14px; background: {{t.soft}}; text-decoration: none; font-weight: 800; font-size: 16px">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="9" width="18" height="12" rx="2"/><path d="M12 9v12"/><path d="M3 13h18"/><path d="M12 9C10 4 6 5 7.5 8c.6 1 4.5 1 4.5 1s3.9 0 4.5-1C18 5 14 4 12 9z"/></svg>Cửa hàng</a>
        <a href="#" style="display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 14px; text-decoration: none; font-weight: 700; font-size: 16px; color: {{t.muted}}">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Lịch sử</a>
        <a href="#" style="display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 14px; text-decoration: none; font-weight: 700; font-size: 16px; color: {{t.muted}}">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h12"/><path d="M8 12h12"/><path d="M8 18h12"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg>Rule</a>
        <a href="KidTheme.dc.html" style="display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 14px; text-decoration: none; font-weight: 700; font-size: 16px; color: {{t.muted}}">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18c1.5 0 2-1 2-2s-1-1.5-1-2.5S14 15 15 15h2a4 4 0 0 0 4-4c0-4.4-4-8-9-8z"/><circle cx="7.5" cy="11" r="1"/><circle cx="10" cy="7" r="1"/><circle cx="15" cy="7.5" r="1"/></svg>Giao diện</a>
      </nav>
    </aside>

    <main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 20px">
      <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px">
        <h1 style="margin: 0; font-family: 'Baloo 2', sans-serif; font-size: 36px; font-weight: 800">Cửa hàng</h1>
        <span style="display: flex; align-items: center; gap: 8px; padding: 8px 18px 8px 10px; border-radius: 99px; background: {{t.card}}; font-family: 'Baloo 2', sans-serif; font-size: 24px; font-weight: 800; box-shadow: 0 2px 0 rgba(0,0,0,.06)">
          <svg width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6 6.6.8-4.9 4.6 1.3 6.5L12 17.2 6.1 20.4l1.3-6.5L2.5 9.3l6.6-.8z" fill="#FFC531" stroke="#8A5A00" stroke-width="1" stroke-linejoin="round"/></svg>{{balance}} Sao</span>
      </div>

      <div style="background: {{t.card}}; border-radius: 24px; padding: 18px 20px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; box-shadow: 0 3px 0 rgba(0,0,0,.05)">
        <div style="width: 56px; height: 56px; border-radius: 16px; background: {{t.soft}}; display: flex; align-items: center; justify-content: center">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="{{t.primary}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l5 7h-3l4 6H6l4-6H7zM12 16v5M5 21h14"/></svg>
        </div>
        <div style="flex: 1 1 260px; display: flex; flex-direction: column; gap: 8px">
          <div style="display: flex; justify-content: space-between; gap: 12px; font-weight: 800"><span style="font-size: 17px">Mục tiêu: Đi công viên</span><span style="color: {{t.muted}}; font-size: 15px">120 / 200 · Còn 80 nữa</span></div>
          <div style="height: 16px; border-radius: 99px; background: {{t.soft}}; overflow: hidden"><div style="width: 60%; height: 100%; border-radius: 99px; background: {{t.accent}}"></div></div>
        </div>
      </div>

      <sc-if value="{{hasPending}}" hint-placeholder-val="{{ true }}">
        <div style="background: #FFF1C2; color: #5C3A00; border-radius: 18px; padding: 12px 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
          <span style="flex: 1 1 240px; font-size: 15px; font-weight: 700"><b>{{pendingName}}</b> đang chờ bố mẹ duyệt. Điểm chưa bị trừ.</span>
          <button onClick="{{cancel}}" style="min-height: 44px; padding: 0 16px; border: 2px solid #5C3A00; background: transparent; color: #5C3A00; border-radius: 14px; font-size: 15px; font-weight: 800">Hủy yêu cầu</button>
        </div>
      </sc-if>

      <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 16px">
        <sc-for list="{{rewards}}" as="r" hint-placeholder-count="6">
          <div style="background: {{t.card}}; border-radius: 24px; padding: 14px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 3px 0 rgba(0,0,0,.05); border: 3px solid {{r.goalBorder}}; position: relative">
            <sc-if value="{{r.isGoal}}" hint-placeholder-val="{{ false }}">
              <span style="position: absolute; top: -11px; left: 14px; font-size: 12px; font-weight: 800; padding: 2px 10px; border-radius: 99px; background: {{t.primary}}; color: {{t.onPrimary}}">Mục tiêu</span>
            </sc-if>
            <div style="height: 120px; border-radius: 18px; background: {{t.soft}}; display: flex; align-items: center; justify-content: center">
              <svg width="68" height="68" viewBox="0 0 24 24" fill="none" stroke="{{t.primary}}" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{r.icon}}"/></svg>
            </div>
            <span style="font-size: 17px; font-weight: 800; line-height: 1.25; min-height: 42px">{{r.name}}</span>
            <span style="font-family: 'Baloo 2', sans-serif; font-size: 22px; font-weight: 800; color: {{t.primary}}">{{r.price}} Sao</span>
            <sc-if value="{{r.canBuy}}" hint-placeholder-val="{{ true }}">
              <button onClick="{{r.buy}}" style="min-height: 46px; border: none; border-radius: 14px; background: {{t.primary}}; color: {{t.onPrimary}}; font-size: 16px; font-weight: 800; box-shadow: 0 3px 0 rgba(0,0,0,.18)">Đổi</button>
            </sc-if>
            <sc-if value="{{r.short}}" hint-placeholder-val="{{ false }}">
              <div style="display: flex; flex-direction: column; gap: 6px; min-height: 46px; justify-content: center">
                <div style="height: 10px; border-radius: 99px; background: {{t.soft}}; overflow: hidden"><div style="width: {{r.pct}}; height: 100%; background: {{t.accent}}; border-radius: 99px"></div></div>
                <span style="font-size: 14px; font-weight: 800; color: {{t.muted}}">Còn thiếu {{r.missing}}</span>
              </div>
            </sc-if>
            <sc-if value="{{r.waiting}}" hint-placeholder-val="{{ false }}">
              <span style="min-height: 46px; display: flex; align-items: center; justify-content: center; border-radius: 14px; background: #FFF1C2; color: #5C3A00; font-size: 15px; font-weight: 800">Chờ duyệt</span>
            </sc-if>
          </div>
        </sc-for>
      </div>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["sunny","ocean","candy","robot","magic"],"default":"sunny"},"$preview":{"width":1280,"height":900}}'>
var THEMES = {
  sunny: { bg: '#FFF6DF', card: '#FFFFFF', soft: '#FFE7A8', ring: '#FFC94D', primary: '#C2410C', onPrimary: '#FFFFFF', accent: '#F59E0B', ink: '#2B2118', muted: '#6B5644' },
  ocean: { bg: '#E6F5FA', card: '#FFFFFF', soft: '#C7ECF5', ring: '#7DD3E8', primary: '#0E7490', onPrimary: '#FFFFFF', accent: '#14B8A6', ink: '#0F2A33', muted: '#486570' },
  candy: { bg: '#FDEEF6', card: '#FFFFFF', soft: '#F8D2E8', ring: '#F0A6D6', primary: '#A21CAF', onPrimary: '#FFFFFF', accent: '#EC4899', ink: '#2E1530', muted: '#6E4D6E' },
  robot: { bg: '#EEF2F7', card: '#FFFFFF', soft: '#D6E0EE', ring: '#F5C518', primary: '#1D4ED8', onPrimary: '#FFFFFF', accent: '#E11D2E', ink: '#0F172A', muted: '#475569' },
  magic: { bg: '#FFF3F8', card: '#FFFFFF', soft: '#FFD9E8', ring: '#F7C948', primary: '#BE185D', onPrimary: '#FFFFFF', accent: '#E9A400', ink: '#3A0F24', muted: '#7A3B5A' }
};
var ICONS = {
  game: 'M6 9h12a3 3 0 0 1 3 3v3a3 3 0 0 1-5 2l-1.5-1.5h-5L8 17a3 3 0 0 1-5-2v-3a3 3 0 0 1 3-3zM8 11v3M6.5 12.5h3M16 12h.01M18 14h.01',
  icecream: 'M8 10a4 4 0 1 1 8 0M7 10h10l-5 11zM9.5 14h5',
  park: 'M12 3l5 7h-3l4 6H6l4-6H7zM12 16v5M5 21h14',
  blocks: 'M4 10h16v10H4zM7 10V7h4v3M13 10V7h4v3M4 15h16',
  book: 'M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2zM4 21V5M8 7h7',
  movie: 'M3 6h18v13H3zM3 10h18M7 6l2 4M12 6l2 4M17 6l2 4'
};
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { pending: 'ice' };
  }
  renderVals() {
    var t = THEMES[this.props.theme ?? 'sunny'] || THEMES.sunny;
    var self = this;
    var balance = 120;
    var list = [
      { id: 'game', name: '30 phút chơi game', price: 50, icon: ICONS.game },
      { id: 'ice', name: 'Kem ốc quế', price: 80, icon: ICONS.icecream },
      { id: 'book', name: 'Chọn truyện mới', price: 100, icon: ICONS.book },
      { id: 'movie', name: 'Tối xem phim cả nhà', price: 150, icon: ICONS.movie },
      { id: 'park', name: 'Đi công viên', price: 200, icon: ICONS.park, goal: true },
      { id: 'lego', name: 'Bộ Lego nhỏ', price: 350, icon: ICONS.blocks }
    ];
    var pend = this.state.pending;
    var rewards = list.map(function (r) {
      var waiting = pend === r.id;
      var enough = balance >= r.price;
      return Object.assign({}, r, {
        isGoal: !!r.goal, goalBorder: r.goal ? t.primary : 'transparent',
        waiting: waiting, canBuy: enough && !waiting, short: !enough,
        missing: r.price - balance,
        pct: Math.min(100, Math.round(balance / r.price * 100)) + '%',
        buy: function () { self.setState({ pending: r.id }); }
      });
    });
    var p = list.filter(function (r) { return r.id === pend; })[0];
    return {
      t: t, balance: balance, rewards: rewards,
      hasPending: !!p, pendingName: p ? p.name : '',
      cancel: function () { self.setState({ pending: null }); }
    };
  }
}
</script>
</body>
</html>
